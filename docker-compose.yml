x-app-image: &app-image
  image: llm-cache:local

services:
  embedding-service:
    <<: *app-image
    command: python -m llm_cache.embedding.grpc.server --config /app/configs/configuration.json
    volumes:
      - ./configs/configuration.json:/app/configs/configuration.json:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50051), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  vector-store-service:
    <<: *app-image
    command: python -m llm_cache.vector_store.grpc.server --config /app/configs/configuration.json
    volumes:
      - ./configs/configuration.json:/app/configs/configuration.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50052), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  llm-service:
    <<: *app-image
    command: python -m llm_cache.llm.grpc.server --config /app/configs/configuration.json
    volumes:
      - ./configs/configuration.json:/app/configs/configuration.json:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50053), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  orchestrator:
    <<: *app-image
    command: python -m llm_cache.orchestrator.grpc.server --config /app/configs/configuration.json
    volumes:
      - ./configs/configuration.json:/app/configs/configuration.json:ro
    ports:
      - "50050:50050"
    depends_on:
      embedding-service:
        condition: service_healthy
      vector-store-service:
        condition: service_healthy
      llm-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50050), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  client:
    <<: *app-image
    build: .
    command: python main.py web --config /app/configs/configuration.json
    volumes:
      - ./configs/configuration.json:/app/configs/configuration.json:ro
    ports:
      - "8080:8080"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://localhost:8080/health', timeout=2); response.read(); response.close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  cli-client:
    <<: *app-image
    build: .
    command: python main.py cli --config /app/configs/configuration.json
    profiles: [cli]
    volumes:
      - ./configs/configuration.json:/app/configs/configuration.json:ro
    depends_on:
      orchestrator:
        condition: service_healthy
    stdin_open: true
    tty: true

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
