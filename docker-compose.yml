services:
  embedding-service:
    build: .
    command: python -m llm_cache.embedding.grpc.server --config /app/configs/configuration.json
    volumes:
      - ./configs/configuration.json:/app/configs/configuration.json:ro
    extra_hosts:
      - host.docker.internal:host-gateway

  vector-store-service:
    build: .
    command: python -m llm_cache.vector_store.grpc.server --config /app/configs/configuration.json
    volumes:
      - ./configs/configuration.json:/app/configs/configuration.json:ro
      - chroma_data:/data/chroma

  llm-service:
    build: .
    command: python -m llm_cache.llm.grpc.server --config /app/configs/configuration.json
    volumes:
      - ./configs/configuration.json:/app/configs/configuration.json:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}

  orchestrator:
    build: .
    command: python -m llm_cache.orchestrator.grpc.server --config /app/configs/configuration.json
    volumes:
      - ./configs/configuration.json:/app/configs/configuration.json:ro
    ports:
      - "50050:50050"
    depends_on:
      - embedding-service
      - vector-store-service
      - llm-service

  client:
    build: .
    command: python -m llm_cache.web.main --config /app/configs/configuration.json
    volumes:
      - ./configs/configuration.json:/app/configs/configuration.json:ro
    ports:
      - "8080:8080"
    depends_on:
      - orchestrator

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  chroma_data:
  ollama_data:
